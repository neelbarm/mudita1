# Sarga Studio: the server + n8n, one laptop, one command.
#   cd studio && docker compose -f deploy/docker-compose.yml up -d
# n8n:    http://localhost:5678  (basic auth from .env)
# hq:     http://localhost:8787/hq  (the command deck)
# server: http://localhost:8787/health
#
# n8n persists to a named volume (SQLite). Import the workflow JSONs
# from deploy/n8n/workflows/ and create one Header Auth credential
# named "Studio API" with header "Authorization: Bearer <STUDIO_API_TOKEN>".

services:
  studio-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - "8787:8787"
    volumes:
      - ../.local:/app/.local
      - ../runs:/app/runs
      - ../artifacts:/app/artifacts
      - ../outbox:/app/outbox
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-sarga}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-change-me}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - N8N_HOST=${N8N_HOST:-localhost}
      - GENERIC_TIMEZONE=${TZ:-America/New_York}
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
